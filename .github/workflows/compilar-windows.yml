name: Compilar instalador de Windows

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Leer versión
        id: version
        shell: bash
        run: echo "valor=$(python -m posteos --version)" >> "$GITHUB_OUTPUT"

      - name: Generar ejecutable (PyInstaller)
        run: pyinstaller packaging/posteos.spec --noconfirm

      - name: Verificar que el ejecutable arranca
        shell: pwsh
        env:
          POSTEOS_DATOS: ${{ runner.temp }}\posteos-datos
        run: |
          $p = Start-Process -FilePath "dist\Posteos\Posteos.exe" -ArgumentList "--autoprueba" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "El ejecutable no respondió" }
          if ($p.ExitCode -ne 0) { throw "El ejecutable terminó con código $($p.ExitCode)" }

      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DVersion=${{ steps.version.outputs.valor }}" packaging\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }

      - name: Versión portable (ZIP)
        shell: pwsh
        run: Compress-Archive -Path dist\Posteos -DestinationPath "dist\instalador\Posteos-Portable-${{ steps.version.outputs.valor }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Posteos-Windows-${{ steps.version.outputs.valor }}
          path: dist/instalador/*
          retention-days: 30

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/instalador/*
